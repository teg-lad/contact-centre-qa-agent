version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    assignees:
      - "teg-lad"
    labels:
      - "dependencies"
    cooldown:
      default-days: 7
    groups:
      python-dependencies:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      python-security-updates:
        applies-to: security-updates
        update-types:
          - "major"
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    assignees:
      - "teg-lad"
    labels:
      - "dependencies"
    cooldown:
      default-days: 7
    groups:
      github-actions-dependencies:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      github-actions-security-updates:
        applies-to: security-updates
        update-types:
          - "major"
          - "minor"
          - "patch"
